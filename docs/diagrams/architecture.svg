<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sovra-arch-title sovra-arch-desc" id="architecture-root">
      <title id="sovra-arch-title">Sovra Verify architecture</title>
      <desc id="sovra-arch-desc">A reviewer uses a React dashboard served by a FastAPI backend. The backend extracts canonical text, identifies claims, compares bounded claim pairs, and resolves citations deterministically against an SQLite evidence store. Claim and comparison reasoning is performed by Apertus 1.5 70B hosted on CSCS, the primary provider. The Hugging Face router is an opt-in backup that is off by default.</desc>

      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', Georgia, serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }</style>
        <pattern id="architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
        </marker>
        <marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#architecture-dots)" opacity="0.55"/>

      <!-- Zones (drawn before arrows and nodes) -->
      <rect x="176" y="160" width="400" height="320" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="292" y="164" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="336" y="173" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">APPLICATION</text>

      <rect x="630" y="160" width="290" height="300" rx="8"
            fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="742" y="164" width="66" height="12" rx="2" fill="#f5f5f5"/>
      <text x="775" y="173" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">INFERENCE</text>

      <!-- Arrows first (behind boxes) -->
      <line x1="156" y1="228" x2="204" y2="228" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-arrow-link)"/>

      <line x1="299" y1="260" x2="299" y2="290" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>

      <line x1="299" y1="354" x2="299" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>

      <!-- FastAPI -> CSCS: leave the right edge, turn once, enter the bottom edge -->
      <path d="M 394,306 H 767 Q 775,306 775,298 V 272"
            fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-arrow-accent)"/>

      <!-- FastAPI -> Hugging Face backup: dashed, opt-in, off by default -->
      <path d="M 394,338 H 767 Q 775,338 775,346 V 360"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>

      <!-- Arrow labels sit on paper masks over their line -->
      <rect x="158" y="206" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="180" y="215" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

      <rect x="241" y="267" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="299" y="276" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">POST /ANALYSES</text>

      <rect x="259" y="368" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="299" y="377" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">SQLITE</text>

      <rect x="424" y="292" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="301" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">CHAT COMPLETIONS</text>

      <rect x="424" y="324" width="150" height="12" rx="2" fill="#f5f5f5"/>
      <text x="499" y="333" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">BACKUP · OFF BY DEFAULT</text>

      <!-- Node: Reviewer -->
      <rect x="40" y="196" width="116" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="196" width="116" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
      <rect x="48" y="204" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="62" y="213" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="98" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">Reviewer</text>
      <text x="98" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">procurement</text>

      <!-- Node: React dashboard -->
      <rect x="204" y="196" width="190" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="204" y="196" width="190" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="212" y="204" width="34" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="229" y="213" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="299" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">React dashboard</text>
      <text x="299" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">upload · findings · review · export</text>

      <!-- Node: FastAPI pipeline (focal) -->
      <rect x="204" y="290" width="190" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="204" y="290" width="190" height="64" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
      <rect x="212" y="298" width="34" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="229" y="307" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="366" y="350" fill="#bf4520" fill-opacity="0.10" font-size="32" font-weight="600"
            font-family="'Geist Mono', monospace" text-anchor="end">01</text>
      <text x="299" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">FastAPI pipeline</text>
      <text x="299" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">extract · claims · compare · cite</text>

      <!-- Node: Evidence store -->
      <rect x="204" y="396" width="190" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="204" y="396" width="190" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="212" y="404" width="34" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="229" y="413" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="299" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">SQLite evidence store</text>
      <text x="299" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">page text · offsets · runs</text>

      <!-- Node: Apertus 1.5 70B on CSCS (focal, primary provider) -->
      <rect x="660" y="200" width="230" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="200" width="230" height="72" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
      <rect x="668" y="208" width="52" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="694" y="217" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">PRIMARY</text>
      <text x="870" y="266" fill="#bf4520" fill-opacity="0.10" font-size="32" font-weight="600"
            font-family="'Geist Mono', monospace" text-anchor="end">02</text>
      <text x="775" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">Apertus 1.5 70B · CSCS</text>
      <text x="775" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">api.inference.cscs.ch/v1</text>
      <text x="775" y="264" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle">8B selectable, never automatic</text>

      <!-- Node: Hugging Face router (backup, off by default) -->
      <rect x="660" y="360" width="230" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="660" y="360" width="230" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1"
            stroke-dasharray="4,3"/>
      <rect x="668" y="368" width="48" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="692" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">BACKUP</text>
      <text x="775" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif"
            text-anchor="middle">Hugging Face router</text>
      <text x="775" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace"
            text-anchor="middle">8B only · 70B not servable here</text>
    </svg>
